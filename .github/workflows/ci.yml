name: CI
on: [push, pull_request]

jobs:
  # 任务 1：常规构建与测试（Debug）
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libopencv-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTELEDRIVE_REQUIRE_OPENCV=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # 任务 2：AddressSanitizer + UBSan。两个任务并行运行，互不拖慢
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libopencv-dev
      - name: Configure
        run: >
          cmake -S . -B build-asan -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DTELEDRIVE_REQUIRE_OPENCV=ON -DTELEDRIVE_SANITIZE=ON
      - name: Build
        run: cmake --build build-asan
      - name: Test under ASan + UBSan
        env:
          UBSAN_OPTIONS: print_stacktrace=1   # UBSan 报错时打印调用栈
        run: ctest --test-dir build-asan --output-on-failure




